<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지하철 좌석 눈치게임 끝!</title>

  <link rel="stylesheet" href="login.css">    <!-- A 담당 -->
  <link rel="stylesheet" href="detail.css">   <!-- B 담당 -->
  <link rel="stylesheet" href="seatmap.css">  <!-- C 담당 -->

  <style>
    /* ⚠️ 공용 규칙 — 셋이 같이 있을 때만 수정 */
    body { font-family: sans-serif; margin: 0; }
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid #ddd;
    }
    .popup-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100;
    }
    .popup-bg.active { display: flex; align-items: center; justify-content: center; }
    .popup {
      background: #fff; padding: 24px; border-radius: 12px;
      max-width: 360px; width: 90%; max-height: 85vh; overflow-y: auto;
    }
  </style>
</head>
<body>

<!-- ============================================================
     화면 1 — 로그인 / 회원가입          [ A 담당 ]
     ============================================================ -->
<div id="screen1" class="screen active">
  <h1>지하철 좌석 눈치게임 끝!</h1>
  <!-- A: 여기에 로그인 폼 + 로그인/회원가입 버튼 -->
</div>

<!-- 회원가입 팝업 — A 담당 -->
<div id="signupPopup" class="popup-bg">
  <div class="popup">
    <h2>회원가입</h2>
    <!-- A: 이름 / 나이 / 성별 / 임산부 / 노약자 / 아이디 / 비번 / 동의 -->
  </div>
</div>


<!-- ============================================================
     화면 2 — 노선도                     [ B 담당 ]
     ============================================================ -->
<div id="screen2" class="screen">
  <div class="topbar">
    <span id="appName">지하철 좌석 눈치게임 끝!</span>
    <button onclick="showScreen(3)">현장대기여부</button>
  </div>
  <!-- B: 여기에 6호선 노선도 이미지 -->
  <div id="lineMap"></div>
</div>


<!-- ============================================================
     화면 3 — 칸 현황                    [ B: 왼쪽 / C: 오른쪽 ]
     ============================================================ -->
<div id="screen3" class="screen">
  <div class="topbar">
    <button onclick="openRoutePopup()">출발/도착지 지정</button>
    <span id="carNumberLabel"></span>
  </div>

  <div style="display:flex; gap:20px; flex-wrap:wrap;">
    <!-- 왼쪽: 프로필 리스트 — B 담당 -->
    <div id="profileList" style="flex:1; min-width:280px;"></div>

    <!-- 오른쪽: 좌석배치도 — C 담당 -->
    <div id="seatMap" style="flex:1; min-width:280px;"></div>
  </div>

  <div class="topbar" style="border-top:1px solid #ddd; border-bottom:none;">
    <span>
      <button onclick="showScreen(2)">돌아가기</button>
      <button onclick="refresh()">새로고침</button>
    </span>
    <button onclick="openSitPopup()">착석하기</button>  <!-- C 담당 -->
  </div>
</div>

<!-- 출발/도착지 팝업 — B 담당 -->
<div id="routePopup" class="popup-bg">
  <div class="popup">
    <h2>출발/도착지 지정</h2>
    <!-- B: 출발지 select / 도착지 select / 칸번호 input -->
  </div>
</div>

<!-- 착석 팝업 — C 담당 -->
<div id="sitPopup" class="popup-bg">
  <div class="popup">
    <h2>좌석 번호 입력</h2>
    <!-- C: 좌석번호 input + 확인 버튼 -->
  </div>
</div>


<!-- ⚠️ 순서 중요! data.js 가 항상 맨 먼저 -->
<script src="data.js"></script>
<script src="app.js"></script>        <!-- 공용 — 아래 내용 -->
<script src="login.js"></script>      <!-- A 담당 -->
<script src="detail-left.js"></script><!-- B 담당 -->
<script src="seatmap.js"></script>    <!-- C 담당 -->

</body>
</html>
